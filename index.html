<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excipure Pharma | Wholesale Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .filter-btn { background: #f1f5f9; color: #64748b; transition: all 0.2s; }
        .filter-btn.active { background: #004b8d; color: white; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .product-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .translate-x-full { transform: translateX(100%); }
        .translate-x-0 { transform: translateX(0); }
        .invisible { visibility: hidden; pointer-events: none; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans">

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="flex flex-col">
                    <span class="block font-bold text-xl leading-none text-[#004b8d]">EXCIPURE</span>
                    <span class="block text-xs tracking-widest text-[#1a7139] font-bold">PHARMA</span>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative p-2 bg-slate-100 rounded-full hover:bg-slate-200 transition">
                <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-[#1a7139] text-white text-[10px] font-bold px-1.5 rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- HERO -->
    <header class="container mx-auto px-6 py-12">
        <div class="bg-white rounded-[2rem] p-8 md:p-16 shadow-sm border border-slate-100 flex flex-col md:flex-row items-center gap-12">
            <div class="md:w-3/5">
                <h1 class="text-5xl md:text-7xl font-black text-slate-900 mb-6 leading-tight">
                    High-Quality <br><span class="text-[#1a7139]">Excipients</span> & <br>Solvents<span class="text-[#004b8d]">.</span>
                </h1>
                <p class="text-slate-500 text-lg mb-8 max-w-lg">Wholesale distributor of pharmaceutical raw materials.</p>
                <a href="#catalog" class="inline-block bg-[#004b8d] text-white px-8 py-4 rounded-xl font-bold hover:bg-opacity-90 transition shadow-lg">Browse Catalog →</a>
            </div>
            <div class="md:w-2/5 grid grid-cols-2 gap-4">
                <div class="p-6 bg-slate-50 rounded-2xl"><i data-lucide="shield-check" class="text-[#004b8d] mb-2"></i><h3 class="font-bold text-sm">Quality Assured</h3></div>
                <div class="p-6 bg-slate-50 rounded-2xl"><i data-lucide="globe" class="text-[#004b8d] mb-2"></i><h3 class="font-bold text-sm">Global Reach</h3></div>
            </div>
        </div>
    </header>

    <!-- CATALOG -->
    <main id="catalog" class="container mx-auto px-6 py-12">
        <div class="flex flex-wrap gap-2 mb-12" id="filter-buttons">
            <button onclick="filterProducts('All')" class="filter-btn active px-6 py-2 rounded-full font-bold text-sm">All</button>
            <button onclick="filterProducts('Excipients')" class="filter-btn px-6 py-2 rounded-full font-bold text-sm">Excipients</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="product-grid"></div>
    </main>

    <!-- MODALS -->
    <!-- Specs Modal -->
    <div id="details-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closeDetails()"></div>
        <div class="relative bg-white rounded-[2rem] w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h2 id="modal-title" class="text-2xl font-black text-[#004b8d]">Product Details</h2>
                <button onclick="closeDetails()"><i data-lucide="x"></i></button>
            </div>
            <div class="overflow-y-auto p-8 space-y-6">
                <p id="modal-desc" class="text-slate-600 leading-relaxed"></p>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div><h4 class="text-xs font-black text-slate-400 uppercase">Function</h4><p id="modal-func" class="font-bold"></p></div>
                    <div><h4 class="text-xs font-black text-slate-400 uppercase">Grade</h4><p id="modal-grade" class="font-bold"></p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT (Internalized) -->
    <script>
        const imgPowder = "https://images.unsplash.com/photo-1587854692152-cbe660dbbb88?q=80&w=800";
        const imgLiquid = "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800";
        const imgCrystals = "https://images.unsplash.com/photo-1576086213369-97a306dca664?q=80&w=800";
        const imgWaxy = "https://images.unsplash.com/photo-1628771065518-0d82f1938462?q=80&w=800";

        const products = [
            { id: 1, name: "Calcium Carbonate", cat: "Excipients", stock: "25 Kg Bag", func: "Diluent", grade: "IP/USP", desc: "Fine white powder used as a diluent.", img: imgCrystals },
            { id: 2, name: "Carbomer (Carbopol)", cat: "Excipients", stock: "Custom", func: "Gelling agent", grade: "IP/USP", desc: "Forms clear gels for topical use.", img: imgWaxy },
            { id: 3, name: "Propylene Glycol", cat: "Excipients", stock: "215 Kg Drum", func: "Solvent", grade: "USP/IP", desc: "Clear viscous liquid.", img: imgLiquid },
            { id: 4, name: "Calcium Stearate", cat: "Excipients", stock: "25 Kg Bag", func: "Lubricant", grade: "USP", desc: "Fine white greasy powder.", img: imgPowder },
            { id: 14, name: "Lactose", cat: "Excipients", stock: "25 Kg Bag", func: "Diluent", grade: "USP/IP", desc: "Standard filler for dosage forms.", img: imgPowder },
            { id: 16, name: "MCC", cat: "Excipients", stock: "25 Kg Bag", func: "Binder", grade: "USP/IP", desc: "Highly compressible binder.", img: imgPowder }
            // (You can add the rest here)
        ];

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => `
                <div class="product-card bg-white rounded-3xl p-4 border border-slate-100 shadow-sm">
                    <img src="${p.img}" class="w-full h-48 object-cover rounded-2xl mb-4">
                    <h3 class="font-bold text-sm mb-2">${p.name}</h3>
                    <div class="flex justify-between items-center">
                        <button onclick="viewDetails(${p.id})" class="text-xs font-bold text-[#004b8d] underline">Specs</button>
                        <button class="w-8 h-8 bg-[#004b8d] text-white rounded-full">+</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function viewDetails(id) {
            const p = products.find(item => item.id === id);
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-desc').innerText = p.desc;
            document.getElementById('modal-func').innerText = p.func;
            document.getElementById('modal-grade').innerText = p.grade;
            document.getElementById('details-modal').classList.remove('hidden');
        }

        function closeDetails() { document.getElementById('details-modal').classList.add('hidden'); }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
            lucide.createIcons();
        });
    </script>
</body>
</html>
